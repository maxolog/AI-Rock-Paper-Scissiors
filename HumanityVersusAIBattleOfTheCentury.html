   did not work with p5, we used ChatGpt to to transform the quickstart code to work for this
   
   Therefore:

   Were NOT writting by ourselves

async function loadMediaPipeLibrary()
{
    const mp = await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
    );

    GestureRecognizer = mp.GestureRecognizer;
    FilesetResolver = mp.FilesetResolver;
    
    console.log("MediaPipe library loaded!");
    
    await loadGestureModel();
}

// Downloads the model
async function loadGestureModel()
{
    try
    {
        // Step 1: Load MediaPipe's supporting WASM files
        const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );

        console.log("WASM loaded!");

        // Step 2: Download and initialise the gesture model
        gestureRecognizer = await GestureRecognizer.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-tasks/gesture_recognizer/gesture_recognizer.task"
                },

                runningMode: "VIDEO",
                numHands: 2
            }
        );

        modelLoaded = true;

        console.log("Gesture model loaded successfully!");
        
        beginGame();    
    }
    catch(error)
    {
        console.error("Model loading failed:", error);
    }
}

function drawWebcamBottomLeft(size, paddingXPercent, paddingYPercent)
{
    let w = width * (size / 100);
    let h = w * (9 / 16);

    let paddingX = width * (paddingXPercent / 100);
    let paddingY = height * (paddingYPercent / 100);

    push();

    translate(paddingX + w, height - paddingY - h);
    scale(-1, 1);

    image(video, 0, 0, w, h);

    pop();
}

    playerMultiplier = 1;
    aiMultiplier = 1;

async function beginGame()
{

    console.log("showing rules");
    await showRules();
    console.log("rules over!");
    
    gameLoop();
}

// Main flow of the game:
async function gameLoop()
{
    while (true) {
        await playRound();
        
        if(checkGameover())
        {
            break;
        }
    }
    
    onGameEnd();
}
async function playRound()
{
    changeAIPortrait("https://crystalpng.com/wp-content/uploads/2025/09/chatgpt-logo.png");
    
    latestResult = null;
    step_ai_decide();
    
    await step_countdown();
    latestResult = null;
    
    await step_recognition();
    
    step_reveal();
    
    await step_evaluation();
}
async function onGameEnd()
{
    let endText = null;
    if(playerHealth <= 0)
    {
        endText = "Ai beat yo ass, you're in the matrix now!";
        console.log("Ai beat yo ass, you're in the matrix now!");
        
        setBackground("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyYUeFGRVh8YZzs86gY060bGTk1CKjgv-Dc2HI8AuzVO9EKN_DM_3uqZHc&s=10");
    }

    {
        endText = "Humanity can live another day!";
        console.log("Humanity can live another day!");
        
        setBackground("https://miro.medium.com/0*Aypjr-lpfhxKXFrl");
    }
    
    showText(endText, 3000, true);
    
    await new Promise(resolve => setTimeout(resolve, 3000));
    
    showText("[THUMB DOWN] to retry saving humanity!");
    
    await waitForGesture("Thumb_Down");
    
    beginGame();
}





// Steps
function step_ai_decide()
{
    // Source - https://stackoverflow.com/a/4550514
    currentGuess = possibility[Math.floor(Math.random() * possibility.length)];
}
async function step_countdown() 
{
    showText("[THUMBS UP] to continue!", 10000);
    
    await waitForGesture("Thumb_Up");
    
    // Source - https://stackoverflow.com/questions/33983614/how-to-create-a-countdown-timer-before-a-function-is-performed
    for (let i = 3; i > 0; i--) {
        console.log(i);
        showText(i, 5000, true);

        await new Promise(resolve => setTimeout(resolve, 1000));
    }

    console.log("GO!");
    showText("GO!", 1000, true);
}
async function step_recognition()
{
    while (!isValidGesture(latestResult))
    {
        // give the video feed to the model and run recognition
        if (modelLoaded && video.elt.readyState >= 2)
        {
            latestResult = gestureRecognizer.recognizeForVideo(
                video.elt,
                millis()
            );
        }
        else console.log("model not ready or something lmao");
        
        await new Promise(resolve => setTimeout(resolve, 50));
    }
}
function step_reveal()
{
    if(currentGuess == "Victory")
    {
        changeAIPortrait("https://media.istockphoto.com/id/1407699129/photo/back-to-school-emoji-concept-with-student-while-using-a-scissors.jpg?s=612x612&w=0&k=20&c=sgvd2wao2BVltlM26iWjhtEo9DPbFt1-H6PU6gnYrM0=");
    }
    else if(currentGuess == "Open_Palm")
    {
        changeAIPortrait("https://thumbs.dreamstime.com/b/smiley-emoticon-holding-blank-board-vector-illustration-73258352.jpg");
    }
    else
    {
        changeAIPortrait("https://c8.alamy.com/comp/2BWXC24/angry-emoji-emoticon-showing-a-punch-fist-gesture-2BWXC24.jpg");
    }
}

async function step_evaluation()
{
    let conversationString = null;
    if (latestResult != null && latestResult.gestures.length > 0)
    {
        let resultString = "";  
        results = evaluationState(latestResult.gestures[0][0].categoryName, currentGuess);
        
        if(results[0])
        {
            drawMultiplier = 1;
            
            let damageToBeDone = 100 * playerMultiplier * drawMultiplier;
            
            aiHealth -= damageToBeDone;
            
            //resultString = "You hit Ai for [" + damageToBeDone + "]!"
            conversationString = "[Ai]: Oh baby, so good with your fingers";
            
            playerMultiplier++;
            aiMultiplier = 1;
        }
        else if(results[1])
        {
            drawMultiplier = 1;
            
            let damageToBeDone = 100 * aiMultiplier * drawMultiplier;
            
            playerHealth -= damageToBeDone;
            
            //resultString = "Ai hit you for [" + damageToBeDone + "]!"
            conversationString = "[Ai]: Omg you are so bad with your fingers";
            
            playerMultiplier = 1;
            aiMultiplier++;
        }
        else
        {
            drawMultiplier *= 2;
            
            resultString = "DRAW [" + drawMultiplier + "X] damage!"
            conversationString = "[Ai]: Finally, a worth opponent, our battle will be legendary!\n\nNEXT ROUND IS [" + drawMultiplier + "X] DAMAGE!"
            
            playerMultiplier = drawMultiplier;
            aiMultiplier = drawMultiplier;
        }
        
        console.log("\n\n");
        console.log(resultString);
        showText(resultString, 3000, true);
        console.log("[AI]: You: " + stateValues[latestResult.gestures[0][0].categoryName] + ", I: " + stateValues[currentGuess]);
        console.log(typeof(stateValues[latestResult.gestures[0][0].categoryName]) + " | " + typeof(stateValues[currentGuess]));
        printScore();
    }
    else console.log("bro where the fuck is the gesture you promised?");
    
    updateUI();
    
    console.log("\n" + conversationString)
    
    for (let i = 3; i > 0; i--) {
        await new Promise(resolve => setTimeout(resolve, 1000));
    }
}

async function waitForGesture(gestureString)
{
    while(latestResult == null || latestResult.gestures.length <= 0 || latestResult.gestures[0][0].categoryName != gestureString)
    {
        // give the video feed to the model and run recognition
        if (modelLoaded && video.elt.readyState >= 2)
        {
            latestResult = gestureRecognizer.recognizeForVideo(
                video.elt,
                millis()
            );
        }
        await new Promise(resolve => setTimeout(resolve, 50));
    }
}
function evaluationState(playerInput, aiInput)
{
    return [
        wins(playerInput, aiInput),
        wins(aiInput, playerInput)
    ];
}
function wins(input, otherInput)
{
    if(input == "Victory" && otherInput == "Open_Palm")
    {
        return true;
    }
    else if(input == "Open_Palm" && otherInput == "Closed_Fist")
    {
        return true;
    }
    else if(input == "Closed_Fist" && otherInput == "Victory")
    {
        return true;
    }
    
    return false;
}
function checkGameover()
{
    if(playerHealth <= 0 || aiHealth <= 0)
    {
        return true;
    }
}
function isValidGesture(result)
{
    const gesture = result?.gestures?.[0]?.[0];

    if (!gesture)
        return false;

    if (!possibility.includes(gesture.categoryName))
        return false;

    return true;
}
function changeAIPortrait(newSource)

function showText(text, duration, fade=false)
{
    if(fade)
    {
        clearTimeout(announcementTimer);
        clearTimeout(animationTimer);
    
        ui.announcementText.html(text);
    
        // Reset animation
        ui.announcementText.style("transition", "none");
        ui.announcementText.style("opacity", "0");
        ui.announcementText.style("transform", "translate(-50%, -50%) scale(0) rotate(-90deg)");
    
        // Force browser to register reset
        ui.announcementText.elt.offsetWidth;
    
        // Animate in
        ui.announcementText.style(
            "transition",
            "transform 0.1s ease-out, opacity 0.3s ease-out"
        );
    
        ui.announcementText.style("opacity", "1");
        ui.announcementText.style("transform", "translate(-50%, -50%) scale(1) rotate(0deg)");
    
        // Animate out
        announcementTimer = setTimeout(() =>
        {
            ui.announcementText.style(
                "transition",
                "transform 0.1s ease-in, opacity 0.3s ease-in"
            );
    
            ui.announcementText.style("opacity", "0");
            ui.announcementText.style("transform", "translate(-50%, -50%) scale(0) rotate(90deg)");
    
        }, duration);
    }
    else 
    {
        clearTimeout(announcementTimer);
        clearTimeout(animationTimer);
    
        ui.announcementText.html(text);
    
        // Reset animation
        ui.announcementText.style("transition", "none");
        ui.announcementText.style("opacity", "0");
        ui.announcementText.style("transform", "translate(-50%, -50%) scale(0) rotate(-90deg)");
    
        // Force browser to register reset
        ui.announcementText.elt.offsetWidth;
    
        // Animate in
        ui.announcementText.style(
            "transition",
            "transform 0.1s ease-out, opacity 0.3s ease-out"
        );
    
        ui.announcementText.style("opacity", "1");
        ui.announcementText.style("transform", "translate(-50%, -50%) scale(1) rotate(0deg)");
    }
}

        // Actual health (GREEN)
        this.healthFill = createDiv();
        this.healthFill.parent(this.healthBar);
        
        this.healthFill.style("position", "absolute");
        this.healthFill.style("left", "0");
        this.healthFill.style("top", "0");
        this.healthFill.style("width", "100%");
        this.healthFill.style("height", "100%");
        this.healthFill.style("background", "#55cc55");
        this.healthFill.style("border-radius", "25px");

        // Multiplier
        this.multiplierLabel = createP();
        this.multiplierLabel.parent(this.panel);
        this.multiplierLabel.style("position", "relative");
        this.multiplierLabel.style("z-index", "2");
        
        this.update();
    }
    
    hideFire()
    {
        if(this.firegif == null) return;
        
        this.firegif.remove();
        this.firegif = null;
    }
    updateFire()
    {
        let t = this.clamp(this.multiplier / this.maxFireMultiplier, 0, 1);

        let minY = 200;
        let maxY = -100;
    
        this.firegif.style("opacity", lerp(0, 0.6, t));
        this.firegif.position(0, lerp(minY, maxY, t));
    }
    showFire()
    {
        if(this.firegif != null)
        {
            this.updateFire();
            return;
        }
        
        this.firegif = createImg("https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/07ed52f9-65de-4d91-afc1-6d9594f0de81/dgvi39q-1e371040-6a37-4adb-b36a-ab2aaa5bde59.gif?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi8wN2VkNTJmOS02NWRlLTRkOTEtYWZjMS02ZDk1OTRmMGRlODEvZGd2aTM5cS0xZTM3MTA0MC02YTM3LTRhZGItYjM2YS1hYjJhYWE1YmRlNTkuZ2lmIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.AyAlTXuKw7RhwMuWjM2QAgB5KzZt2cxDZgBj5eceJGU");
        this.firegif.style("width", "100%");
        this.firegif.parent(this.panel);
        this.firegif.style("z-index", "0");
        
        this.updateFire();
    }
   

    update()
    {
        let percentage = Math.max(0, this.health / this.maxHealth * 100);

        this.healthFill.style("width", percentage + "%");

        this.nameLabel.html(this.name + "      " + this.health + "/" + this.maxHealth);

        this.multiplierLabel.html(
            "Multiplier: " + this.multiplier + "x"
        );
    }
    // Source - https://www.js-craft.io/blog/clamp-numbers-in-javascript/
    clamp(val, min, max)
    {
        return Math.min(Math.max(val, min), max);
    }
    setHealth(health)
    {
        this.health = Math.max(0, health);
    
        let percentage = Math.max(
            0,
            this.health / this.maxHealth * 100
        );
    
        this.healthFill.style("width", percentage + "%");
    
        // Red bar catches up after 1 second
        setTimeout(() =>
        {
            this.dmgIndicator.style(
                "transition",
                "width 1s ease-out"
            );
    
            this.dmgIndicator.style(
                "width",
                percentage + "%"
            );
    
        }, 1000);
    
        this.update();
    }

    setMultiplier(multiplier)
    {
        this.multiplier = multiplier;
        
        if(this.multiplier >= 2)
        {
            this.showFire();
        }
        else
        {
            this.hideFire();
        }
        
        this.update();
    }

    takeDamage(damage)
    {
        this.setHealth(Math.max(0, this.health - damage));
    }
}


</script>
</body>
